# Master configuration for the retained VixSTORY tooling.
# Profiles (smoke/pilot/small/medium/full) override `data.profile` via configs/<profile>.yaml.
# Only keys a retained stage reads live here; every value that changes an experiment outcome
# must be logged into the run manifest.

data:
  profile: full

laya:
  model: convaiinnovations/laya-multilingual
  # revision is resolved at run time (laya.revisions.PINNED_REVISIONS, else the Hub SHA)
  revision: null
  frozen: rlcd        # regime the frozen policy rolls out with; "none" = the no-prior ablation
  max_len: 768
  head_max_len: 192
  micro_batch: 1
  grad_accum: 8
  epochs: 3
  encoder_lr: 2.5e-05
  head_lr: 0.0001
  seed: 42
  freeze_encoder: false
  target_error: 0.1   # abstention thresholds are fitted to this error target
  min_abstain_n: 10   # smallest calibration bucket a threshold may be fitted on
  # Temperature calibration split. TrainConfig-only: the laya-train CLI does not expose it,
  # so a CLI rerun of a recorded command is not equivalent unless these stay at these values.
  calib_max: 400
  calib_frac: 0.1
  calib_seed: 20260922
  device: auto
