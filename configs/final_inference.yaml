# Final inference configuration (P9 — spec 02_IMPLEMENTATION/07 §1; required in the
# acceptance checklist's repository tree). Overlay on base.yaml; loads the frozen medium
# chain of 2026-10-09 (reader P3, Laya rlcd P5, REINFORCE policy P6 — see
# reports/FINAL_HANDOFF.md and reports/artifact_manifest.sha256).
#
#   python -m src.inference.cli \
#     --question 'Phạm Văn Đồng bắt đầu giữ chức Thủ tướng CHXHCN Việt Nam từ năm nào?' \
#     --config configs/final_inference.yaml --show-trace
#
# The demo corpus is the val_strict split (test_strict is refused by design); user corpora
# come from --corpus-jsonl. Laya probabilities for demo questions are memoized in their own
# cache (outputs/models/laya_probs_cache_demo), never mixed with the training caches.

inference:
  # The frozen P6 policy decides; no fallback to the raw Laya prior.
  decision_rule: policy
