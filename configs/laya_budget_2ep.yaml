# D015 — Laya fine-tune budget overlay: 2 epochs for both CE and RLCD (2026-10-09).
#
# Measured on this VPS before committing (spec 03 §2/§6: profile first, then scale):
#   per train item 0.208 s (max_len 768, micro_batch 1), fixed overhead 13.9 s, peak VRAM 6.1 GiB;
#   slice is length-representative (mean state 2,555 vs 2,523 chars; ~751 vs ~742 implied tokens).
# The medium teacher holds 34,593 train items after the temperature-calibration slice, so
# base.yaml's 3 epochs here project to 6 h per loss — 12 h for CE+RLCD — which would consume the
# whole remaining-chain GPU guardrail before cache_laya / B5 / baselines.
# CE and RLCD run identical conditions (spec 04 §4/§6): both 2 epochs, same data, same seed.
# See docs/DECISIONS.md D015 for the decision record and the honest-reporting notes.

laya:
  epochs: 2