  "rl": {
    "algorithm": "reinforce",
    "batch_episodes": 32,
    "checkpoint_every": 25,
    "early_stop_patience": 6,
    "entropy_coef": 0.005,
    "eval_episodes": 64,
    "eval_every": 25,
    "gamma": 1.0,
